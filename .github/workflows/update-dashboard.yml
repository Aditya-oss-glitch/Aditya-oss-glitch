name: Update GitHub Dashboard

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-update
  cancel-in-progress: true

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch live data
        run: python scripts/fetch_github_data.py

      - name: Render dashboard
        run: python scripts/render_dashboard_svg.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git fetch origin main
            git rebase origin/main

            python scripts/fetch_github_data.py
            python scripts/render_dashboard_svg.py

            git add data/github.json profile-dashboard.svg

            if git diff --cached --quiet; then
              echo "No dashboard changes."
              exit 0
            fi

            git commit -m "chore: update dashboard data"

            if git push origin HEAD:main; then
              echo "Dashboard update pushed successfully."
              exit 0
            fi

            echo "Push raced with another update. Retrying..."
            git reset --soft HEAD~1
          done

          echo "Could not push after 3 attempts."
          exit 1
