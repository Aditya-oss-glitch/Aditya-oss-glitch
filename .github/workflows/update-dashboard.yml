name: Update GitHub Dashboard

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch live data
        run: |
          python scripts/fetch_github_data.py

      - name: Render dashboard
        run: |
          python scripts/render_dashboard_svg.py

      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/github.json profile-dashboard.svg

          if git diff --cached --quiet; then
            echo "No dashboard changes."
          else
            git commit -m "chore: update dashboard data"
            git push
          fi
