<svg
xmlns="http://www.w3.org/2000/svg"
width="770"
height="806"
viewBox="0 0 770 806"
role="img"
aria-label="Animated ASCII portrait">

<style>
.ascii {
    font-family:
        Menlo,
        Monaco,
        Consolas,
        "Courier New",
        monospace;

    font-size: 12px;
    font-weight: 400;
    fill: #8a8a8a;
}

.row {
    opacity: 0;
}

@keyframes rowReveal {

    0% {
        opacity: 0;
        transform: translateX(-10px);
    }

    100% {
        opacity: 1;
        transform: translateX(0);
    }
}
</style>

